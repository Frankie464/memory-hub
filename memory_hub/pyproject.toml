[project]
name = "memory-hub"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "streamlit>=1.40",
    "pandas>=1.4",
    "mcp>=1.0",
    "anthropic>=0.40",
    "sentence-transformers>=3.0",
    "numpy>=1.24",
]

[project.scripts]
hub = "memory_hub.cli:cli"
hub-mcp = "memory_hub.mcp_server:main_sync"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
